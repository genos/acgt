[project]
name = "acgt"
version = "0.6.0"
description = "A silly example, intended to show how algebraic structure (commutative monoids) can yield computational benefits (map-shuffle-reduce parallelism)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyprojroot>=0.3.0",
    "ray>=2.59.0",
    "typer>=0.27.3",
]

[project.scripts]
data = "acgt.data:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "ipython>=9.17.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
