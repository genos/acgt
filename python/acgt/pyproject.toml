[project]
name = "acgt"
version = "0.3.0"
description = "A silly example, intended to show how algebraic structure (commutative monoids) can yield computational benefits (map-shuffle-reduce parallelism)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyprojroot>=0.3.0",
    "ray>=2.55.1",
    "typer>=0.25.1",
]

[project.scripts]
data = "acgt.data:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.152.9",
    "ipython>=9.13.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
